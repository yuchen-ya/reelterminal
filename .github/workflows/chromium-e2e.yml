name: Chromium E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium-e2e:
    name: Chromium runtime and Agent transport E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Show ffmpeg/ffprobe used for verification
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Typecheck facade + runtime
        run: |
          pnpm --filter @reelterminal/agent-facade typecheck
          pnpm --filter @reelterminal/runtime-chromium typecheck

      - name: Typecheck agent-transport
        run: pnpm --filter @reelterminal/agent-transport typecheck

      - name: Run facade tests
        run: pnpm --filter @reelterminal/agent-facade test:run --maxWorkers=2
      - name: Run Chromium runtime tests (probe, E2E, jobs, verify)
        run: |
          ulimit -c 0
          pnpm --filter @reelterminal/runtime-chromium test:run --maxWorkers=2
      - name: Run agent-transport tests (run/doctor over the real binary, e2e-gated)
        run: |
          ulimit -c 0
          pnpm --filter @reelterminal/agent-transport test:run --maxWorkers=2
      - name: Check evidence privacy and size before upload
        id: evidence-check
        if: always()
        run: node scripts/security/check-ci-artifacts.mjs packages/runtime-chromium/.artifacts/
      - name: Upload machine-readable evidence
        if: ${{ always() && steps.evidence-check.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-evidence
          path: |
            packages/runtime-chromium/.artifacts/**/*.json
            packages/runtime-chromium/.artifacts/**/*.png
            packages/runtime-chromium/.artifacts/**/*.md
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3
          compression-level: 9
  transport-suite-matrix:
    name: Facade and transport suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium

      - name: Install Chromium for Playwright (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install chromium
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Verify native diagnostic reporter failure handling
        run: node --test packages/agent-facade/test/report-native-process-metrics.node-test.mjs

      - name: Verify real native timeout and failure cleanup
        run: node --test packages/agent-facade/test/native-test-scope.node-test.mjs

      - name: Run facade suite with native process timings
        # Match the main CI's worker budget; concurrent FFmpeg/Python probes
        # otherwise compete with the short native-process regression cases.
        id: facade-suite
        shell: bash
        run: |
          mkdir -p .cache/native-normalize
          export NODE_OPTIONS="--require=$PWD/packages/agent-facade/test/native-process-metrics.cjs"
          export REELTERMINAL_TEST_NATIVE_METRICS_FILE="$PWD/.cache/native-normalize/competing"
          export REELTERMINAL_TEST_NATIVE_METRICS_LABEL="full-suite-two-workers"
          pnpm --filter @reelterminal/agent-facade test:run --maxWorkers=2 --reporter=verbose --reporter=json --outputFile=../../.cache/native-normalize/competing-results.json

      - name: Diagnose native normalization alone without replacing the original result
        if: ${{ always() && (steps.facade-suite.outcome == 'success' || steps.facade-suite.outcome == 'failure') }}
        shell: bash
        run: |
          export NODE_OPTIONS="--require=$PWD/packages/agent-facade/test/native-process-metrics.cjs"
          export REELTERMINAL_TEST_NATIVE_METRICS_FILE="$PWD/.cache/native-normalize/isolated"
          export REELTERMINAL_TEST_NATIVE_METRICS_LABEL="isolated-one-worker"
          pnpm --filter @reelterminal/agent-facade exec vitest run src/audio-normalize.test.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile=../../.cache/native-normalize/isolated-results.json

      - name: Record native stages, process exits and diagnostic overhead
        if: ${{ always() && (steps.facade-suite.outcome == 'success' || steps.facade-suite.outcome == 'failure') }}
        run: node packages/agent-facade/test/report-native-process-metrics.mjs .cache/native-normalize packages/agent-facade/.artifacts/native-normalize/report.json
      - name: Check native diagnostic evidence privacy and size
        id: native-evidence-check
        if: always()
        run: node scripts/security/check-ci-artifacts.mjs packages/agent-facade/.artifacts/native-normalize
      - name: Upload native diagnostic evidence
        if: ${{ always() && steps.native-evidence-check.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: native-normalize-${{ matrix.os }}
          path: packages/agent-facade/.artifacts/native-normalize/*.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 9

      - name: Run transport suite over the real binary
        run: pnpm --filter @reelterminal/agent-transport test:run --maxWorkers=2
