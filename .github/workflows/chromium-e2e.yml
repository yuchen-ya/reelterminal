name: Chromium E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-e2e:
    name: Chromium runtime and Agent transport E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Show ffmpeg/ffprobe used for verification
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Typecheck facade + runtime
        run: |
          pnpm --filter @reelterminal/agent-facade typecheck
          pnpm --filter @reelterminal/runtime-chromium typecheck

      - name: Typecheck agent-transport
        run: pnpm --filter @reelterminal/agent-transport typecheck

      - name: Run facade tests
        run: pnpm --filter @reelterminal/agent-facade test:run
      - name: Run Chromium runtime tests (probe, E2E, jobs, verify)
        run: |
          ulimit -c 0
          pnpm --filter @reelterminal/runtime-chromium test:run
      - name: Run agent-transport tests (serve/run/doctor over the real binary, e2e-gated)
        run: |
          ulimit -c 0
          pnpm --filter @reelterminal/agent-transport test:run
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-e2e-evidence
          path: packages/runtime-chromium/.artifacts/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
  transport-suite-matrix:
    name: Facade and transport suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright (Linux)
        if: runner.os == 'Linux'
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium

      - name: Install Chromium for Playwright (macOS)
        if: runner.os == 'macOS'
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install chromium
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Run facade suite (pure Node; platform-independent)
        run: pnpm --filter @reelterminal/agent-facade test:run

      - name: Run transport suite over the real binary
        run: pnpm --filter @reelterminal/agent-transport test:run
