name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECT_FFMPEG: "1"
      EXPECT_AUDIO_MODELS_PYTHON: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use official Ubuntu APT mirrors
        shell: bash
        run: |
          # Ubuntu 24.04 runner images use Deb822 sources and an Azure-first mirror list.
          # Change only known Ubuntu mirror URIs; retain suites, components and Signed-By.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/etc/apt/sources.list.d/ubuntu.sources')
          text = path.read_text()
          mirrors = {'mirror+file:/etc/apt/apt-mirrors.txt',
                     'http://azure.archive.ubuntu.com/ubuntu',
                     'https://azure.archive.ubuntu.com/ubuntu'}
          def official_mirrors(match):
              stanza = match.group(0)
              suites = re.search(r'^Suites:[ \t]*(.*)$', stanza, re.MULTILINE)
              security = suites and suites[1].split() and all(
                  suite.endswith('-security') for suite in suites[1].split())
              uri = 'https://security.ubuntu.com/ubuntu/' if security else 'https://archive.ubuntu.com/ubuntu/'
              return re.sub(r'^(URIs:[ \t]*)(.*)$', lambda line: line[1] + re.sub(
                  r'\S+', lambda token: uri if token[0].rstrip('/') in mirrors else token[0], line[2]),
                  stanza, flags=re.MULTILINE)
          path.write_text(re.sub(r'(?:[^\n]+\n?)+', official_mirrors, text))
          PY

      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Fetch the pinned native export sidecar
        run: pnpm --filter @reelterminal/desktop fetch:ffmpeg

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Check product naming
        run: pnpm lint:naming

      - name: Verify security patches and audit dependencies
        run: pnpm audit:dependencies

      - name: Run tests
        # Browser/media suites and DOM workers share the runner memory and CPU.
        run: pnpm -r --workspace-concurrency=1 test:run --maxWorkers=2
      - name: Check third-party notice generation
        run: pnpm --filter @reelterminal/desktop test:licenses
      - name: Disk-usage diagnostic (top /tmp consumers)
        if: always()
        run: |
          df -h /
          du -sh /tmp/* 2>/dev/null | sort -rh | head -15 || true

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

  auxiliary-tests:
    name: Native and filter tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/filters/requirements.txt
      - name: Test native creation engine
        run: |
          cmake -S packages/creation-core -B packages/creation-core/build
          cmake --build packages/creation-core/build
          ctest --test-dir packages/creation-core/build --output-on-failure
      - name: Test filter tools
        run: |
          python -m pip install -r scripts/filters/requirements.txt
          python -m pytest scripts/filters/tests -v
