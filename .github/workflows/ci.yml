name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Check product naming
        run: pnpm lint:naming

      - name: Verify security patches and audit dependencies
        run: pnpm audit:dependencies

      - name: Run tests
        # Browser/media suites and DOM workers share the runner memory and CPU.
        run: pnpm -r --workspace-concurrency=1 test:run
      - name: Disk-usage diagnostic (top /tmp consumers)
        if: always()
        run: |
          df -h /
          du -sh /tmp/* 2>/dev/null | sort -rh | head -15 || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

  auxiliary-tests:
    name: Native and filter tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/filters/requirements.txt
      - name: Test native creation engine
        run: |
          cmake -S packages/creation-core -B packages/creation-core/build
          cmake --build packages/creation-core/build
          ctest --test-dir packages/creation-core/build --output-on-failure
      - name: Test filter tools
        run: |
          python -m pip install -r scripts/filters/requirements.txt
          python -m pytest scripts/filters/tests -v
