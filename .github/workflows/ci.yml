name: CI

on:
  push:
    branches: [main]
  pull_request:
    # stacked-PR CI: include the slice-3 stack base while PRs #5/#6 are open
    branches: [main, feat/agent-transport-slice-2]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The full-monorepo install + Chromium + browser-profile residue brings
      # ubuntu runners within ENOSPC range (observed 2026-08-31: suites dying
      # with "no space left on device" mid-run). Reclaim the big preinstalled
      # toolchains this repo never uses before installing.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/julia* /opt/az /usr/share/miniconda /usr/local/share/boost || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h /

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # packages/runtime-chromium launches real Chromium in its tests, and
      # ubuntu-latest ships no ffmpeg (frames-route encoder + verifier).
      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install --with-deps chromium

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run linting
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      # Records where the space actually went if a suite still tips the
      # runner into ENOSPC — the next tuning decision (concurrency caps,
      # profile cleanup) should be driven by measurement, not guesses.
      - name: Disk-usage diagnostic (top /tmp consumers)
        if: always()
        run: |
          df -h /
          du -sh /tmp/* 2>/dev/null | sort -rh | head -15 || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build
