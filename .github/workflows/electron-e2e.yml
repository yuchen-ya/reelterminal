name: Electron E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  electron-e2e:
    name: Live-collaboration E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record tested commit
        run: git rev-parse HEAD

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python for external packaged workers
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/scripts/packaging-smoke-requirements.txt
      - name: Install CPU image smoke dependencies
        run: >-
          python -m pip install --only-binary=:all: -r apps/desktop/scripts/packaging-smoke-requirements.txt
      - name: Verify packaged-worker failure evidence
        run: python -I -B -m unittest discover -s apps/desktop/scripts -p test_verify_packaged_resources.py
      - name: Install Chromium for Playwright
        run: pnpm --filter @reelterminal/runtime-chromium exec playwright-core install chromium
      - name: Install ffmpeg
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - name: Install pinned and verified ffmpeg and ffprobe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/install-windows-ffmpeg.ps1

      - name: Show ffmpeg/ffprobe used for verification
        shell: bash
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Fetch the pinned native export sidecars
        run: pnpm --filter @reelterminal/desktop fetch:ffmpeg
      - name: Verify native export and packaging regressions without skips
        env:
          EXPECT_FFMPEG: "1"
        run: >-
          pnpm --filter @reelterminal/desktop exec vitest run
          test/export-file-protection.test.ts test/export-integration.test.ts
          src/main/sidecar/export-job.test.ts src/main/ipc/export.test.ts
          test/ipc-contract.test.ts test/packaging-config.test.ts --maxWorkers=2
      - name: Build desktop app
        run: pnpm --filter @reelterminal/desktop build
      - name: Build unpacked app for physical resource verification
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm --filter @reelterminal/desktop exec electron-builder --dir --win --x64 --publish never --config.win.signAndEditExecutable=false
          else
            pnpm --filter @reelterminal/desktop exec electron-builder --dir --mac --"$(node -p process.arch)" --publish never --config.mac.notarize=false
          fi
      - name: Verify physical workers, icon decode and four synthetic OpenCV algorithms
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            resources=apps/desktop/release/win-unpacked/resources
          else
            resources=$(find apps/desktop/release -path '*/ReelTerminal.app/Contents/Resources' -type d -print -quit)
            test -n "$resources"
          fi
          python -I -B apps/desktop/scripts/verify-packaged-resources.py --resources "$resources" --source-root . --require-opencv --report apps/desktop/e2e/.artifacts/packaging/resources.json
      - name: Disk usage report
        shell: bash
        run: df -h /
      - name: Run Electron E2E (flows A+B, cross-cutting, endpoint safety)
        env:
          REELTERMINAL_E2E_SMALL_WINDOW: "1"
        shell: bash
        run: |
          ulimit -c 0
          pnpm --filter @reelterminal/desktop test:e2e
      - name: Check evidence privacy and size before upload
        id: evidence-check
        if: always()
        run: node scripts/security/check-ci-artifacts.mjs apps/desktop/e2e/.artifacts/
      - name: Upload machine-readable evidence
        if: ${{ always() && steps.evidence-check.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-evidence-${{ matrix.os }}
          path: |
            apps/desktop/e2e/.artifacts/**/*.json
            apps/desktop/e2e/.artifacts/**/*.png
            apps/desktop/e2e/.artifacts/**/*.md
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 3
          compression-level: 9
