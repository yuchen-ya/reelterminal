name: Electron E2E

# Slice-3 (ADR 0004) live human–agent collaboration E2E: the REAL built
# Electron app driven by real UI input (Playwright `_electron`), a REAL MCP
# stdio client (sdk Client → openreel-mcp shim → live endpoint) as the
# external agent, pixel-verified render frames, and the token security
# boundary — with machine-readable evidence uploaded from
# apps/desktop/e2e/.artifacts (mirroring the chromium-e2e evidence pattern).
#
# macOS-only, deliberately: the suite boots the app windowed and its timing
# was validated by the author on macOS alone. An ubuntu+xvfb leg was NOT
# added because it could not be validated locally — an honest exclusion
# beats an unverified one (same discipline as the chromium workflow's
# Windows exclusion).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron-e2e:
    name: Electron live-collaboration E2E (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # preview.render_frame runs the runtime-chromium providers in the
      # desktop MAIN process — needs the Playwright-managed Chromium.
      - name: Install Chromium for Playwright
        run: pnpm --filter @openreel/runtime-chromium exec playwright-core install chromium

      # Pixel assertions decode the rendered PNG with ffmpeg; the artifact
      # verifier needs ffprobe. Neither ships on macos runners.
      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Show ffmpeg/ffprobe used for verification
        run: |
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # The e2e launches the REAL build: renderer (vite) + main (tsup,
      # incl. the mcp-shim the external agent channel spawns).
      - name: Build desktop app
        run: pnpm --filter @openreel/desktop build

      # Disk footprint is modest on macOS runners (no docker images, one
      # Chromium): unlike the ubuntu chromium-e2e leg, no reclaim step is
      # needed — keep the report for the day that stops being true.
      - name: Disk usage report
        run: df -h /

      # ulimit -c 0: the runtime SIGKILLs real Chromium on teardown; core
      # dumps of a multi-GB browser process are useless and huge.
      - name: Run Electron E2E (flows A+B, cross-cutting, legacy safety)
        run: |
          ulimit -c 0
          pnpm --filter @openreel/desktop test:e2e

      # Evidence MUST exist and MUST upload: revisions, conflict codes,
      # pixel stats, security probes, and screenshots are the
      # machine-readable proof of what this run measured. Hidden directory
      # (.artifacts) — hence include-hidden-files — and a missing upload
      # fails the job, never warns silently. v4 artifacts are immutable by
      # name: overwrite lets a rerun replace the failed attempt's upload.
      - name: Upload machine-readable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-evidence
          path: apps/desktop/e2e/.artifacts/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
