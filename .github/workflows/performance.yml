name: Performance regression
run-name: Performance ${{ inputs.profile || 'contracts' }} @ ${{ inputs.commit || github.sha }}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit SHA to measure
        required: true
        type: string
      profile:
        description: Short trial first; stress includes one continuous 30-minute soak
        required: true
        default: smoke
        type: choice
        options: [smoke, stress]

permissions:
  contents: read

# Serialize manual measurements across branches; never cancel an active soak.
concurrency:
  group: performance-${{ github.event_name == 'workflow_dispatch' && 'hosted-manual' || github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    name: Performance correctness and structure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate runner, result, baseline and report contracts
        run: pnpm --filter @reelterminal/desktop test:perf:counts
      - name: Verify off path and collector lifecycle
        run: |
          pnpm --filter @reelterminal/core exec vitest run src/performance --maxWorkers=2
          pnpm --filter @reelterminal/desktop exec vitest run src/main/performance src/shared/performance-contract.test.ts src/preload/performance-bridge.test.ts --maxWorkers=2
      - name: Verify gestures, history, fonts and persistence
        run: >-
          pnpm --filter @reelterminal/web exec vitest run
          src/performance
          src/services/workspace-manager.perf.test.ts
          src/components/editor/timeline/ClipComponent.gesture.test.tsx
          src/components/editor/timeline/TextClipComponent.gesture.test.tsx
          src/components/editor/timeline/ShapeClipComponent.gesture.test.tsx
          src/components/editor/preview/history-frame-renderer.test.ts
          src/components/editor/preview/history-frame-readiness.test.ts
          --maxWorkers=2

  report:
    name: Hosted Windows ${{ inputs.profile }}
    if: github.event_name == 'workflow_dispatch'
    needs: contracts
    runs-on: windows-latest
    # Existing runner worst-case budgets total < 180 minutes; reserve 30 for setup.
    timeout-minutes: 210
    defaults:
      run:
        shell: pwsh
    env:
      PERF_COMMIT: ${{ inputs.commit }}
      PERF_PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependency/build cache writes or expanded artifact retention.
      - name: Record fixed commit, runner and exact scenario parameters
        run: node scripts/performance/hosted.mjs prepare
      - run: pnpm install --frozen-lockfile
      - name: Build the measured production bundles
        run: pnpm --filter @reelterminal/desktop build
      - name: Calibrate the production probe without changing thresholds
        timeout-minutes: 12
        run: pnpm --filter @reelterminal/desktop test:perf:calibrate
      - name: Run existing synthetic scenarios serially, stopping at the first failure
        run: node scripts/performance/hosted.mjs run
      - name: Write anonymous report and retain functional failures
        if: always()
        run: >-
          node scripts/performance/ci-report.mjs
          --directory apps/desktop/e2e/.artifacts/performance
          --calibration apps/desktop/e2e/.artifacts/performance
          --baseline docs/performance/baselines/manifest.json
          --policy report-only --fixed-runner false
          --json apps/desktop/e2e/.artifacts/performance-ci/report.json
          --markdown apps/desktop/e2e/.artifacts/performance-ci/report.md
      - name: Add bounded resource evidence and job summary
        if: always()
        run: |
          node scripts/performance/hosted.mjs summarize
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content apps/desktop/e2e/.artifacts/performance-ci/hosted.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          if (Test-Path apps/desktop/e2e/.artifacts/performance-ci/report.md) {
            Get-Content apps/desktop/e2e/.artifacts/performance-ci/report.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
      - name: Retain only anonymous summaries and small resource diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ inputs.profile }}-${{ inputs.commit }}-${{ github.run_attempt }}
          path: apps/desktop/e2e/.artifacts/performance-ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
