packages:
  - "apps/*"
  - "packages/*"
overrides:
  'http-cache-semantics@<4.2.1': 4.3.0
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
  '@opentelemetry/core@<2.8.0': 2.8.0
  '@xmldom/xmldom@<0.9.12': 0.9.12
  'brace-expansion@^2': 2.1.7
  'minimatch@^9.0.0': 9.0.7
  'sharp@<0.35.4': 0.35.4
  'undici@<7.29.1': 7.29.1
  'ws@<8.21.0': 8.21.0
onlyBuiltDependencies:
  - electron
ignoredBuiltDependencies:
  - core-js
  - esbuild
  - onnxruntime-node
  - protobufjs
  - sharp
  - workerd
allowBuilds:
  core-js: false
  electron: true
  electron-winstaller: false
  esbuild: false
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  workerd: false
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
  - electron@44.5.1
  - esbuild@0.28.1
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - '@opentelemetry/core@2.8.0'
  - '@xmldom/xmldom@0.9.12'
  - brace-expansion@2.1.7
  - minimatch@9.0.7
  - sharp@0.35.4
  - ws@8.21.0
  - undici@7.29.1
patchedDependencies:
  braces@3.0.3: patches/braces@3.0.3.patch
auditConfig:
  # Mitigated by the pinned braces patch. The security gate verifies the
  # installed depth guard before accepting this version-based exception.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
