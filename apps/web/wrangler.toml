name = "openreel"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# Cloudflare Pages configuration for the ReelTerminal video editor
# (Pages project name "openreel" below is the existing deployment identity).
# This app requires special headers for SharedArrayBuffer (used by FFmpeg.wasm)
# Custom domains:
# - app.openreel.video opens the standard video editor flow
# - motion.openreel.video opens the Motion Creator surface by hostname detection

[env.production]
name = "openreel"

[env.preview]
name = "openreel-preview"
