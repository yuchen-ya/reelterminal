appId: video.reelterminal.desktop
productName: ReelTerminal
# Predictable, space-free, arch-suffixed names → clean R2 URLs + a simple
# manifest (e.g. ReelTerminal-1.2.3-arm64.dmg, ReelTerminal-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
asarUnpack:
  - dist/live-mcp/**
  - dist/aurora-host/**
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# R2-backed download subdomain and generate latest*.yml + blockmaps; the release
# CI uploads everything to R2 (the generic provider does not upload itself).
publish:
  provider: generic
  url: https://github.com/yuchen-ya/reelterminal/releases/latest/download
  channel: latest
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
extraFiles:
  - from: resources/help
    to: help
    filter:
      - "*.html"
  # A packaged Windows launcher that invokes Electron's bundled Node runtime
  # against the reelctl entry. It is also copied with resources/bin for callers
  # that prefer an explicit resources path.
  - from: resources/bin/reelctl.cmd
    to: reelctl.cmd
  - from: resources/bin/reelterminal-live-mcp.cmd
    to: reelterminal-live-mcp.cmd
  - from: resources/bin/openreel-live-mcp.cmd
    to: openreel-live-mcp.cmd
mac:
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  icon: build/icon.png
  target:
    # NSIS wizard installer (choose install dir) + zip for portable use.
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Layered data cleanup at uninstall time (program / projects+library /
  # agent workspace / caches), driven by uninstall-info.ini written by the
  # app. Default remains "keep everything user-owned".
  include: build/installer.nsh
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
