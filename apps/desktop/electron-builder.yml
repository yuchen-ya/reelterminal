appId: video.reelterminal.desktop
productName: ReelTerminal
# Predictable, space-free, arch-suffixed names for release downloads and a simple
# manifest (e.g. ReelTerminal-1.2.3-arm64.dmg, ReelTerminal-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
asarUnpack:
  # All external Python workers and their sibling helpers/resources must be
  # physical files. Ordinary Python cannot read Electron's virtual ASAR tree.
  - dist/python/**
  - dist/aurora-host/**
  # Node workers execute from real files and resolve the unpacked ONNX packages.
  - dist/main/segmentation/**
  # Native ONNX runtime for Silero VAD and MobileSAM segmentation. The main
  # bundle keeps the require() external, so the packaged app loads the .node
  # binary from node_modules at runtime; the JS dependency is unpacked too so
  # unpacked entry points can resolve it from the same real directory.
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
# Keep native ONNX binaries only for the target platform/arch after packing.
# Platform files lists create separate matchers after normalization and can
# bypass the shared allowlist/exclusions below; keep all payload rules here.
afterPack: scripts/prune-onnx-runtime.mjs
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# GitHub Releases download URL and generate latest*.yml + blockmaps. Upload
# these alongside the installers; the generic provider does not publish them.
publish:
  provider: generic
  url: https://github.com/yuchen-ya/reelterminal/releases/latest/download
  channel: latest
files:
  - dist/**/*
  - "!**/*.map"
  # Workspace dependencies are copied too: Git ignores do not prevent local
  # evidence or test fixtures from entering the distributable node_modules.
  - "!**/.artifacts{,/**}"
  - "!**/{test,tests,__tests__,e2e}{,/**}"
  - "!**/*.{test,spec}.{ts,tsx,js,cjs,mjs}"
  - "!**/{.env,.env.*,.npmrc,.pypirc,.git-credentials}"
  - "!**/{.git,.aws,.ssh}{,/**}"
  - package.json
  # ONNX runtime binaries are pruned per target/arch in the platform sections
  # below: the packaged app only ever loads its own platform+arch binding.
extraResources:
  - from: resources/segmentation/mobilesam
    to: segmentation/mobilesam
    filter:
      - "mobilesam-encoder-fp32.onnx"
      - "mobilesam-decoder-dynamic-fp32.onnx"
      - "manifest.json"
      - "LICENSE-MobileSAM.txt"
      - "NOTICE-MobileSAM.txt"
  - from: build/icon.png
    to: icon.png
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "*.cmd"
      - "MANIFEST.json"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
      - "!blender{,/**}"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
  - from: resources/licenses
    to: LICENSES
    filter:
      - "**/*"
extraFiles:
  - from: resources/help
    to: help
    filter:
      - "*.html"
  # A packaged Windows launcher that invokes Electron's bundled Node runtime
  # against the reelctl entry. It is also copied with resources/bin for callers
  # that prefer an explicit resources path.
  - from: resources/bin/reelctl.cmd
    to: reelctl.cmd
mac:
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer"
        - "libcreation_core.dylib"
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer.exe"
        - "creation_core.dll"
  icon: build/icon.png
  target:
    # NSIS wizard installer (choose install dir) + zip for portable use.
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # The custom hook preserves all configured data-root layers and shared settings.
  # Standard explicit --delete-app-data still removes AppData profile folders.
  # Legacy uninstallers are blocked pending a supported migration.
  include: build/installer.nsh
linux:
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer"
        - "libcreation_core.so"
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
