appId: video.reelterminal.desktop
productName: ReelTerminal
# Predictable, space-free, arch-suffixed names for release downloads and a simple
# manifest (e.g. ReelTerminal-1.2.3-arm64.dmg, ReelTerminal-1.2.3-x64.exe).
artifactName: ${productName}-${version}-${arch}.${ext}
asar: true
asarUnpack:
  # All external Python workers and their sibling helpers/resources must be
  # physical files. Ordinary Python cannot read Electron's virtual ASAR tree.
  - dist/python/**
  - dist/aurora-host/**
  # Native ONNX runtime for the Silero VAD speech-activity analysis. The main
  # bundle keeps the require() external, so the packaged app loads the .node
  # binary from node_modules at runtime; the JS dependency is unpacked too so
  # unpacked entry points can resolve it from the same real directory.
  - node_modules/onnxruntime-node/**
  - node_modules/onnxruntime-common/**
# Keep only the target platform/arch binaries (mac builds arm64+x64 together,
# so config-level pruning alone would ship both trees in every installer).
afterPack: scripts/prune-onnx-runtime.mjs
directories:
  output: release
# Update feed for electron-updater. Builds embed app-update.yml pointing at the
# GitHub Releases download URL and generate latest*.yml + blockmaps. Upload
# these alongside the installers; the generic provider does not publish them.
publish:
  provider: generic
  url: https://github.com/yuchen-ya/reelterminal/releases/latest/download
  channel: latest
files:
  - dist/**/*
  - "!**/*.map"
  # Workspace dependencies are copied too: Git ignores do not prevent local
  # evidence or test fixtures from entering the distributable node_modules.
  - "!**/.artifacts{,/**}"
  - "!**/{test,tests,__tests__,e2e}{,/**}"
  - "!**/*.{test,spec}.{ts,tsx,js,cjs,mjs}"
  - "!**/{.env,.env.*,.npmrc,.pypirc,.git-credentials}"
  - "!**/{.git,.aws,.ssh}{,/**}"
  - package.json
  # ONNX runtime binaries are pruned per target/arch in the platform sections
  # below: the packaged app only ever loads its own platform+arch binding.
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "*.cmd"
      - "MANIFEST.json"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
      - "!blender{,/**}"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
  - from: resources/licenses
    to: LICENSES
    filter:
      - "**/*"
extraFiles:
  - from: resources/help
    to: help
    filter:
      - "*.html"
  # A packaged Windows launcher that invokes Electron's bundled Node runtime
  # against the reelctl entry. It is also copied with resources/bin for callers
  # that prefer an explicit resources path.
  - from: resources/bin/reelctl.cmd
    to: reelctl.cmd
mac:
  files:
    # Keep only the darwin bindings. The mac targets ship arm64 and x64, so
    # both darwin trees stay; other OS binaries would never be loaded.
    # electron-builder prepends a default **/* matcher when a platform-specific
    # files list contains only negations, which would re-include sources,
    # tests and e2e evidence; the explicit dist pattern keeps that matcher
    # scoped to the app payload.
    - "dist/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32{,/**}"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux{,/**}"
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer"
        - "libcreation_core.dylib"
  category: public.app-category.video
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  files:
    # Windows x64 only: drop the other OS trees and the unused win32/arm64
    # binding (~69 MB unpacked) from every installer. The positive pattern
    # keeps electron-builder from adding a default **/* matcher for a
    # negations-only platform list (which would package src/e2e/tests).
    - "dist/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin{,/**}"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux{,/**}"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64{,/**}"
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer.exe"
        - "creation_core.dll"
  icon: build/icon.png
  target:
    # NSIS wizard installer (choose install dir) + zip for portable use.
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Layered data cleanup at uninstall time (program / projects+library /
  # agent workspace / caches), driven by uninstall-info.ini written by the
  # app. Default remains "keep everything user-owned".
  include: build/installer.nsh
linux:
  files:
    # Linux x64 only: keep the x64 binding, drop the other OS trees and the
    # unused linux/arm64 binding. The positive pattern avoids a default **/*
    # matcher for this negations-only platform list.
    - "dist/**/*"
    - "!node_modules/onnxruntime-node/bin/napi-v6/win32{,/**}"
    - "!node_modules/onnxruntime-node/bin/napi-v6/darwin{,/**}"
    - "!node_modules/onnxruntime-node/bin/napi-v6/linux/arm64{,/**}"
  extraResources:
    - from: resources/aurora
      to: aurora
      filter:
        - "creation_aurora_renderer"
        - "libcreation_core.so"
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
